name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm install, not npm ci.
      #
      # The lockfile is generated on Windows and cannot record the Linux-only
      # optional dependencies that sharp pulls in (@emnapi/core, @emnapi/
      # runtime). npm ci treats those as a mismatch and refuses to install at
      # all, so the build died before reaching the export. Regenerating the
      # lockfile locally does not fix it — npm cannot resolve another
      # platform's optional deps from Windows.
      #
      # npm install resolves per-platform at build time. The trade is losing
      # exact-version reproducibility from the lockfile.
      - run: npm install --no-audit --no-fund

      - name: Build static export
        # The site serves from the apex of crystalwatersplumbing.com.au, so there
        # is no basePath. public/CNAME is what claims the domain on GitHub's
        # side; the two go together. Setting NEXT_PUBLIC_BASE_PATH here again
        # would serve every asset from /crystal-waters-plumbing/ on the apex,
        # which renders the site completely unstyled while the build stays
        # green — so verify the shipped bundle, not the workflow result.
        run: npm run build

      - name: Disable Jekyll
        # Without this, Pages runs the output through Jekyll, which drops every
        # directory beginning with an underscore — including _next. The site
        # would deploy "successfully" and render completely unstyled.
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
